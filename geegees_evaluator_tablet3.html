<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gee-Gees Tryout — Evaluator Console</title>
<style>
  :root{
    --garnet:#7A1F3D;
    --garnet-dark:#5A1630;
    --ink:#211C1F;
    --paper:#F3EFE8;
    --card:#FFFFFF;
    --line:#DAD2C6;
    --turf:#2F6B4F;
    --turf-dark:#1F4E38;
    --flag:#B23A48;
    --gold:#B98A2E;
    --grey:#8A8478;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;}
  .app{max-width:920px;margin:0 auto;padding-bottom:80px;}

  /* HEADER */
  header{background:var(--garnet);color:#fff;padding:14px 16px 0 16px;position:sticky;top:0;z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .brand{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand .sub{font-size:12px;opacity:.8;}
  .id-row{display:flex;gap:8px;margin:10px 0 12px 0;flex-wrap:wrap;}
  .id-row input{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:8px;padding:8px 10px;font-size:14px;flex:1;min-width:120px;}
  .id-row input::placeholder{color:rgba(255,255,255,.65);}

  /* TAB STRIPS */
  .tabstrip{display:flex;overflow-x:auto;gap:6px;padding:0 0 10px 0;scrollbar-width:none;}
  .tabstrip::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;
    background:rgba(255,255,255,.10);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.25);
    cursor:pointer;white-space:nowrap;}
  .tab.active{background:#fff;color:var(--garnet-dark);border-color:#fff;}

  .stationstrip{display:flex;overflow-x:auto;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);
    scrollbar-width:none;position:sticky;top:96px;z-index:15;}
  .stationstrip::-webkit-scrollbar{display:none;}
  .stbtn{flex:0 0 auto;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;min-width:118px;}
  .stbtn .n{display:block;font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--grey);margin-bottom:2px;}
  .stbtn.active{border-color:var(--garnet);background:#FBEFF2;color:var(--garnet-dark);}
  .stbtn.active .n{color:var(--garnet);}

  main{padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:15px;margin:0 0 2px 0;}
  .card .focus{font-size:12.5px;color:var(--grey);margin:0 0 14px 0;line-height:1.4;}

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--ink);}
  .field .setup{font-size:11.5px;color:var(--grey);margin:-4px 0 8px 0;line-height:1.35;}

  .numctl{display:flex;align-items:center;gap:10px;}
  .numctl button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:20px;font-weight:700;color:var(--garnet);cursor:pointer;}
  .numctl input{flex:1;text-align:center;font-size:20px;font-weight:700;padding:9px 4px;border-radius:10px;
    border:1.5px solid var(--line);background:#FAF8F4;min-width:0;}
  .unit{font-size:12px;color:var(--grey);min-width:34px;}
  .numctl-sm{display:flex;align-items:center;gap:4px;}
  .numctl-sm button{width:30px;height:30px;flex:0 0 auto;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    font-size:16px;font-weight:700;color:var(--garnet);cursor:pointer;line-height:1;padding:0;}
  .numctl-sm button:active{background:#FBEFF2;}
  .numctl-sm input{width:44px;text-align:center;font-size:15px;font-weight:800;padding:6px 2px;border-radius:8px;
    border:1.5px solid var(--line);background:#FAF8F4;}

  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{flex:1;min-width:64px;padding:12px 8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);text-align:center;}
  .pill.yes-sel{background:var(--turf);border-color:var(--turf-dark);color:#fff;}
  .pill.no-sel{background:var(--flag);border-color:#8B2833;color:#fff;}
  .pill.scale-sel{background:var(--garnet);border-color:var(--garnet-dark);color:#fff;}

  .routegrid{display:flex;flex-direction:column;gap:10px;}
  .routerow{display:flex;align-items:center;gap:10px;}
  .routerow .rname{font-size:13px;font-weight:600;width:78px;flex:0 0 auto;}
  .routerow .btnrow{flex:1;}
  .routerow .pill{min-width:0;padding:10px 4px;font-size:13px;}
  .rretotal{margin-top:10px;font-size:12.5px;color:var(--grey);text-align:right;}
  .rretotal b{color:var(--garnet-dark);font-size:14px;}

  .logbtn{width:100%;padding:15px;border-radius:12px;border:none;background:var(--garnet);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(122,31,61,.3);}
  .logbtn:active{background:var(--garnet-dark);}
  .logbtn:disabled{background:var(--grey);box-shadow:none;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .confirmOverlay{display:none;position:fixed;inset:0;background:rgba(33,28,31,.55);z-index:100;
    align-items:center;justify-content:center;padding:20px;}
  .confirmBox{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .confirmBox p{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 18px 0;}
  .confirmBtns{display:flex;gap:10px;}
  .confirmBtns button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);}
  #confirmCancelBtn{background:#fff;color:var(--ink);}
  #confirmOkBtn{background:var(--flag);border-color:#8B2833;color:#fff;}

  /* SCRIMMAGE */
  .eventgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media(min-width:600px){.eventgrid{grid-template-columns:1fr 1fr 1fr;}}
  .evbtn{padding:12px 8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;text-align:left;cursor:pointer;}
  .evbtn .pts{font-weight:800;font-size:15px;}
  .evbtn.pos .pts{color:var(--turf);}
  .evbtn.neg .pts{color:var(--flag);}
  .evbtn .label{display:block;font-size:11.5px;color:var(--ink);margin-top:2px;line-height:1.25;}
  .evbtn:active{background:#F3EFE8;}
  .runningtotal{display:flex;justify-content:space-between;align-items:center;background:#FAF8F4;border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;margin-bottom:14px;}
  .runningtotal .label{font-size:12.5px;color:var(--grey);font-weight:600;}
  .runningtotal .val{font-size:22px;font-weight:800;color:var(--garnet-dark);}

  /* LOG */
  .logcard summary, details.card summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--garnet-dark);padding:2px 0;list-style:none;}
  details.card summary::-webkit-details-marker{display:none;}
  details.card summary::before{content:'▸ ';}
  details.card[open] summary::before{content:'▾ ';}
  table.logtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
  table.logtable th,table.logtable td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;white-space:nowrap;}
  table.logtable th{color:var(--grey);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
  .logwrap{overflow-x:auto;}
  .exportbar{display:flex;gap:8px;margin-top:12px;}
  .exportbar button{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--garnet);background:#fff;
    color:var(--garnet-dark);font-weight:700;font-size:13px;cursor:pointer;}
  .empty{font-size:12.5px;color:var(--grey);padding:8px 0;}
  .synctag{font-size:10.5px;color:var(--grey);margin-top:6px;}
  .day6{font-size:13px;color:var(--grey);line-height:1.5;padding:6px 2px;}

  .modeToggle{display:flex;gap:6px;margin-bottom:10px;}
  .modebtn{flex:1;padding:9px;border-radius:9px;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.10);color:rgba(255,255,255,.85);font-size:13px;font-weight:700;cursor:pointer;}
  .modebtn.active{background:#fff;color:var(--garnet-dark);border-color:#fff;}

  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar select,.filterbar input{flex:1;min-width:110px;padding:10px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:13px;color:var(--ink);}
  .ghost{padding:11px 16px;border-radius:10px;border:1.5px solid var(--garnet);background:#fff;color:var(--garnet-dark);
    font-weight:700;font-size:13.5px;cursor:pointer;}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  @media(min-width:600px){.statgrid{grid-template-columns:repeat(7,1fr);}}
  .statbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;}
  .statbox .n{font-size:19px;font-weight:800;color:var(--garnet-dark);display:block;}
  .statbox .l{font-size:10.5px;color:var(--grey);font-weight:700;}

  .snapgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
  @media(min-width:600px){.snapgrid{grid-template-columns:repeat(4,1fr);}}
  .snapbox{background:#FAF8F4;border:1px solid var(--line);border-radius:10px;padding:12px;}
  .snapbox .l{font-size:10.5px;color:var(--grey);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .snapbox .v{font-size:20px;font-weight:800;color:var(--garnet-dark);margin-top:2px;}
  .combinelist{font-size:12px;color:var(--ink);line-height:1.6;margin-top:4px;}

  /* SIGN-IN & PINNIES */
  textarea.rostertext{width:100%;min-height:140px;border-radius:10px;border:1.5px solid var(--line);padding:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;resize:vertical;}
  .toggle-link{background:none;border:none;color:var(--garnet-dark);font-size:12.5px;font-weight:700;
    text-decoration:underline;cursor:pointer;padding:4px 0;}
  table.roster{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.roster th{text-align:left;font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.3px;
    padding:6px 6px;border-bottom:2px solid var(--line);}
  table.roster td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr.present{background:#F2F8F4;}
  tr.notified-absent{background:#FBF3E7;}
  .statusbtns{display:flex;gap:5px;}
  .nabtn{padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
    font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink);}
  .nabtn.on{background:var(--gold);border-color:#8A6A1E;color:#fff;}
  .pinnycell{display:flex;align-items:center;gap:5px;}
  .pinnybadge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;
    border-radius:8px;background:var(--garnet);color:#fff;font-weight:800;font-size:14px;padding:0 6px;}
  .pinnybadge.unassigned{background:#EDE8DE;color:var(--grey);}
  input.pinnyedit{width:52px;padding:6px;border-radius:8px;border:1.5px solid var(--line);text-align:center;font-weight:700;}
  input.pinnyedit.unassigned{background:#FAF8F4;color:var(--grey);font-weight:600;}
  .assignbtn{padding:6px 8px;border-radius:8px;border:1.5px solid var(--garnet);background:#fff;color:var(--garnet-dark);
    font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .rostername{font-weight:700;}
  .rosteryear{color:var(--grey);font-size:12px;}
  .rosterpos{color:var(--grey);font-size:11.5px;line-height:1.3;max-width:220px;}
  .presentbtn{padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
    font-weight:700;font-size:12.5px;cursor:pointer;min-width:92px;}
  .presentbtn.on{background:var(--turf);border-color:var(--turf-dark);color:#fff;}
  .checktime{font-size:10.5px;color:var(--grey);display:block;margin-top:3px;}
  .rmbtn{background:none;border:none;color:var(--grey);font-size:16px;cursor:pointer;padding:4px;}
  .dangerzone{border-color:var(--flag);}

  /* TEAM SELECTION */
  .decisionbadge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    letter-spacing:.2px;}
  .decisionbadge.team1{background:#DCEFE3;color:var(--turf-dark);}
  .decisionbadge.team2{background:#E4EEF7;color:#1F4E6E;}
  .decisionbadge.reserve{background:#F3EAD2;color:var(--gold);}
  .decisionbadge.release{background:#F6DEE1;color:#8B2833;}
  .decisionbadge.undecided{background:#EDE8DE;color:var(--grey);}
  .decidebtns{display:flex;gap:5px;flex-wrap:wrap;}
  .decidebtns button{padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    font-size:10.5px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap;}
  .decidebtns button.team1.on{background:var(--turf);border-color:var(--turf-dark);color:#fff;}
  .decidebtns button.team2.on{background:#2E6DA4;border-color:#1F4E6E;color:#fff;}
  .decidebtns button.reserve.on{background:var(--gold);border-color:#8A6A1E;color:#fff;}
  .decidebtns button.release.on{background:var(--flag);border-color:#8B2833;color:#fff;}
  .comparegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .comparecol{background:#FAF8F4;border:1px solid var(--line);border-radius:12px;padding:12px;}
  .comparename{display:flex;justify-content:space-between;align-items:flex-start;font-weight:800;font-size:14px;
    margin-bottom:8px;gap:6px;}
  .comparestat{font-size:12px;color:var(--grey);margin-bottom:4px;}
  .comparestat b{color:var(--ink);font-size:13.5px;}
  .comparepos{font-size:11px;color:var(--grey);margin:6px 0 10px 0;line-height:1.35;}
  .comparechips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .comparechip{display:flex;align-items:center;gap:6px;background:#FAF8F4;border:1px solid var(--line);
    border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;}
  .comparechip button{background:none;border:none;color:var(--grey);cursor:pointer;font-size:13px;padding:0;}
  input.comparecheck{width:18px;height:18px;}
  .walkonpos{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .poscheck{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
  .poscheck input{width:17px;height:17px;}
  textarea.comparenote{width:100%;min-height:50px;margin-top:8px;padding:8px;border-radius:8px;
    border:1.5px solid var(--line);font-size:12px;font-family:inherit;resize:vertical;background:#fff;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>GEE-GEES TRYOUT — EVALUATOR CONSOLE</h1>
      <span class="sub"><span id="dateTag"></span> &nbsp;<span id="syncStatus" style="font-weight:700">● Syncing…</span></span>
    </div>
    <div class="modeToggle">
      <button id="modeEvaluator" class="modebtn active">Evaluator — Station Entry</button>
      <button id="modeCoach" class="modebtn">Head Coach — Dashboard</button>
      <button id="modeCheckin" class="modebtn">Sign-In &amp; Pinnies</button>
      <button id="modeSelection" class="modebtn">Team Selection</button>
    </div>
    <div class="id-row" id="idRow">
      <input id="evalName" placeholder="Your initials" maxlength="6">
      <input id="podLabel" placeholder="Group (A–E)" maxlength="4">
    </div>
    <div class="tabstrip" id="sessionTabs"></div>
  </header>

  <div class="stationstrip" id="stationTabs"></div>

  <main id="mainArea"></main>

</div>
<div class="toast" id="toast"></div>
<div class="confirmOverlay" id="confirmOverlay">
  <div class="confirmBox">
    <p id="confirmMessage"></p>
    <div class="confirmBtns">
      <button id="confirmCancelBtn" class="ghost">Cancel</button>
      <button id="confirmOkBtn" class="danger">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   DATA MODEL
   Each session (1-5) has 5 rotation stations with tap-optimized
   field sets condensed from the full packet's metrics. Sessions
   6-7 are full scrimmage days (no station rotation).
---------------------------------------------------------------- */
const SESSIONS = {
  1:{label:"D1", name:"Baseline Athleticism & Fundamentals", scrimmage:false,
    stations:[
      {name:"40-Yard Dash", tag:"COMBINE", fields:[
        {id:"t40",label:"40-yd time",type:"num",unit:"sec",step:0.01},
        {id:"split10",label:"10-yd split",type:"num",unit:"sec",step:0.01}
      ]},
      {name:"WR/QB: Out·Hook·In·Go", tag:"ROUTE", setup:"2 QB pods of 4. Score each route 0–5 (timing+separation+finish).", fields:[
        {id:"rre",type:"route",routes:["Out","Hook","In","Go"]}
      ]},
      {name:"Gauntlet Plus", tag:"CATCH", setup:"8 balls in 90 seconds, thrown from both sides.", fields:[
        {id:"caught",label:"Caught",type:"num",unit:"/8",min:0,max:8,step:1},
        {id:"fumbles",label:"Fumbles after catch",type:"num",unit:"ct",min:0,max:8,step:1},
        {id:"penalty",label:"Time penalty (drop pickup)",type:"yn"}
      ]},
      {name:"DB: Backpedal→Hip Flip→Sprint→Catch", tag:"DB/BLITZ", setup:"Blitzer alt: sprint to 12yd, redirect on signal to cone.", fields:[
        {id:"role",label:"Role this rep",type:"choice",options:["DB","Blitzer"]},
        {id:"time",label:"Time through zone / to cone",type:"num",unit:"sec",step:0.01},
        {id:"hipflip",label:"Hip flip fluidity (DB)",type:"scale5"},
        {id:"secured",label:"Catch/INT secured (DB) or correct cone (Blitzer)",type:"yn"}
      ]},
      {name:"Beat the Flag (10-yd Box)", tag:"PURSUIT", setup:"O vs DB, opposite sides of 10-yd box, 5 reps.", fields:[
        {id:"cross",label:"Successful crossings",type:"num",unit:"/5",min:0,max:5,step:1},
        {id:"flags",label:"Flags allowed (defender)",type:"num",unit:"/5",min:0,max:5,step:1},
        {id:"time",label:"Time to cross",type:"num",unit:"sec",step:0.01}
      ]}
    ]},
  2:{label:"D2", name:"Change of Direction", scrimmage:true,
    stations:[
      {name:"5-10-5 Shuttle + Catch-Plant", tag:"COMBINE", fields:[
        {id:"shuttle",label:"Shuttle time",type:"num",unit:"sec",step:0.01},
        {id:"catchmid",label:"Catch at middle cone",type:"yn"},
        {id:"plant",label:"Plant clean",type:"yn"}
      ]},
      {name:"WR/QB: In·Post·Corner (x2)", tag:"ROUTE", setup:"6 routes — 2 reps each of In, Post, Corner.", fields:[
        {id:"rre",type:"route",routes:["In #1","In #2","Post #1","Post #2","Corner #1","Corner #2"]}
      ]},
      {name:"High-Point Contest", tag:"CATCH", setup:"5 reps vs coach with paddle simulating contact.", fields:[
        {id:"catches",label:"Catches",type:"num",unit:"/5",min:0,max:5,step:1},
        {id:"contested",label:"Contested wins (secured through contact)",type:"num",unit:"/5",min:0,max:5,step:1}
      ]},
      {name:"DB Mirror / Blitzer Pressure (Live)", tag:"DB/BLITZ", setup:"Live rep: Centre releases, DB mirrors, Blitzer rushes from 7yd.", fields:[
        {id:"role",label:"Role this rep",type:"choice",options:["DB","Blitzer"]},
        {id:"mirror",label:"Mirror technique grade (DB)",type:"scale5"},
        {id:"inphase",label:"Stayed in-phase (DB)",type:"yn"},
        {id:"pbuint",label:"PBU / INT (DB)",type:"num",unit:"ct",min:0,max:5,step:1},
        {id:"sack",label:"Sack (Blitzer)",type:"yn"},
        {id:"pressure",label:"Pressure (Blitzer)",type:"yn"},
        {id:"penalty",label:"Penalty (Blitzer)",type:"yn"}
      ]},
      {name:"Box Pull", tag:"PURSUIT", setup:"20x10yd box, two 5-yd gates. Defender takes direct angle.", fields:[
        {id:"flags",label:"Flags",type:"num",unit:"/5",min:0,max:5,step:1},
        {id:"angle",label:"Correct angle",type:"yn"},
        {id:"gate",label:"Gate reached (carrier)",type:"yn"},
        {id:"overpursuit",label:"Over-pursuit",type:"num",unit:"ct",min:0,max:5,step:1}
      ]}
    ]},
  3:{label:"D3", name:"Agility & Body Control", scrimmage:true,
    stations:[
      {name:"Reactive Break + Catch", tag:"COMBINE", setup:"Coach at cone 2 gives live L/R call at the break.", fields:[
        {id:"time",label:"Time to cone 2",type:"num",unit:"sec",step:0.01},

let state = { session:1, station:0, mode:"station", viewMode:"evaluator", values:{}, runningPts:0 };
let entries = [];
// Tracked across every save to any storage key, so the app can warn before
// the tab closes if there's something that hasn't safely landed yet —
// either a save still in flight, or the last known sync attempt failed.
let pendingSaves = 0;
let lastSyncOk = true;
// ---------------------------------------------------------------
// BACKEND — a Google Apps Script Web App backed by a Google Sheet,
// standing in for Claude's artifact storage so this works no matter
// how the HTML file is opened/shared, and so all 7 tablets genuinely
// hit the same backend over the real internet. See
// geegees_backend_AppsScript.gs for the one-time setup.
// ---------------------------------------------------------------
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxTSGI49WOZdG2CURFPjZGsv7zWecjEhu7_q9iI8gFuwm8P70psn2MHlFE-epttjPUB/exec';
async function cloudGet(key){
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 8000);
    const res = await fetch(`${BACKEND_URL}?key=${encodeURIComponent(key)}`, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) return null;
    const data = await res.json();
    return (data && data.value !== undefined && data.value !== null) ? { value: data.value } : null;
  }catch(e){ return null; }
}
async function cloudSet(key, value){
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 8000);
    // mode:'no-cors' + text/plain: the write itself reaches Apps Script and
    // succeeds regardless, but Apps Script's /exec URL redirects internally
    // in a way that strips the CORS headers a normal 'cors' request needs to
    // read the response — confirmed directly against real data, where every
    // write had actually landed even though the app reported "sync failed."
    // In no-cors mode the response is deliberately opaque (we can't read its
    // status or body at all), so reaching this line without an exception is
    // the only confirmation available — and it's an accurate one, since the
    // one thing that DOES still throw here is a real network failure or the
    // 8-second timeout above.
    await fetch(BACKEND_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key, value }),
      signal: controller.signal
    });
    clearTimeout(timer);
    return { key, value };
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  pendingSaves++;
  try{ return await cloudSet(key, value); }
  finally{ pendingSaves--; }
}
const STORAGE_KEY = "geegees-tryout-entries";

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
/* Native confirm()/alert() are commonly blocked inside sandboxed iframes
   (which is how this app runs in an artifact preview), where they either
   throw or silently return false with no dialog ever shown — making any
   "if(!await customConfirm(...)) return;" guard exit immediately, every time, with
   nothing visibly happening. This in-page modal replaces that dependency. */
function customConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('confirmOverlay');
    document.getElementById('confirmMessage').textContent = message;
    overlay.style.display = 'flex';
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    const cleanup = (result)=>{
      overlay.style.display = 'none';
      okBtn.onclick = null; cancelBtn.onclick = null;
      resolve(result);
    };
    okBtn.onclick = ()=> cleanup(true);
    cancelBtn.onclick = ()=> cleanup(false);
  });
}

/* ---------------------------------------------------------------
   PERSISTENCE (shared across evaluator tablets)
---------------------------------------------------------------- */
function mergeEntriesById(local, fresh){
  const map = new Map();
  fresh.forEach(e=>{ if(e && e.id) map.set(e.id, e); });
  local.forEach(e=>{ if(e && e.id) map.set(e.id, e); });
  return Array.from(map.values()).sort((a,b)=> new Date(a.ts) - new Date(b.ts));
}
async function loadEntries(){
  try{
    const res = await cloudGet(STORAGE_KEY);
    const fresh = res && res.value ? JSON.parse(res.value) : [];
    // MERGE, never blindly replace — this is called both at startup (where
    // it's harmless either way, since local is empty) and from the
    // "Refresh now" button, which is user-triggered and could easily land
    // while a save from a rep logged moments ago is still in flight.
    // Confirmed directly: refreshing while a save was pending wiped that
    // rep both locally AND in the backend (the still-queued save
    // re-serializes whatever `entries` is at the moment it actually runs).
    entries = mergeEntriesById(entries, fresh);
  }catch(e){}
  renderLog();
}
// Serialized the same way as rosterWriteChain/decisionsWriteChain: rapid
// taps (log a rep, immediately log another before the first save lands)
// can otherwise have their responses arrive out of order, letting an
// earlier, smaller snapshot overwrite a later, more complete one. Each
// queued write reads `entries` fresh at the moment it actually runs, so
// by the time it's this write's turn, it always reflects everything
// logged up to that point.
let entriesWriteChain = Promise.resolve();
async function saveEntries(){
  entriesWriteChain = entriesWriteChain.then(async ()=>{
    try{
      const res = await storageSet(STORAGE_KEY, JSON.stringify(entries), true);
      if(!res){ toast("Saved locally — sync failed"); return false; }
      return true;
    }catch(e){ toast("Saved locally — sync failed"); return false; }
  });
  return entriesWriteChain;
}

  try{
    const res = await cloudGet('geegees-evaluator-name');
    if(res && res.value) document.getElementById('evalName').value = res.value;
  }catch(e){}
}

function fieldControl(f){
  const val = state.values[f.id];
  if(f.type==='num'){
    return `<div class="numctl">
      <button data-act="dec" data-id="${f.id}" data-step="${f.step||1}">−</button>
      <input type="number" inputmode="decimal" data-id="${f.id}" value="${val!==undefined?val:''}" placeholder="0">
      <span class="unit">${f.unit||''}</span>
      <button data-act="inc" data-id="${f.id}" data-step="${f.step||1}">+</button>
    </div>`;
  }
  if(f.type==='yn'){
    return `<div class="btnrow">
      <button class="pill ${val===true?'yes-sel':''}" data-act="yn" data-id="${f.id}" data-val="true">YES</button>
      <button class="pill ${val===false?'no-sel':''}" data-act="yn" data-id="${f.id}" data-val="false">NO</button>
    </div>`;
  }
  if(f.type==='scale5'){
    return `<div class="btnrow">` + [1,2,3,4,5].map(n=>
      `<button class="pill ${val===n?'scale-sel':''}" data-act="scale" data-id="${f.id}" data-val="${n}">${n}</button>`
    ).join('') + `</div>`;
  }
  if(f.type==='choice'){
    return `<div class="btnrow">` + f.options.map(o=>
      `<button class="pill ${val===o?'scale-sel':''}" data-act="choice" data-id="${f.id}" data-val="${o}">${o}</button>`
    ).join('') + `</div>`;
  }
  return '';
}

      const pct = max? Math.round(sum/max*100):0;
      html += `<div class="field"><label>Route scores (tap 0–5 per rep)</label><div class="routegrid">`;

    } else {
      html += `<div class="field"><label>${f.label}</label>${fieldControl(f)}</div>`;
    }
  });
  html += `</div>
    <button class="logbtn" id="logBtn">Log Rep — Athlete #${state.values._athlete || '—'}</button>`;
  main.innerHTML = html;
  attachFieldListeners();

function attachFieldListeners(){
  document.querySelectorAll('[data-act="inc"],[data-act="dec"]').forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, step=parseFloat(b.dataset.step)||1;
      let cur = parseFloat(state.values[id]) || 0;
      cur = b.dataset.act==='inc' ? cur+step : cur-step;
      cur = Math.round(cur*100)/100;
      state.values[id]=cur;
      renderCurrentForm();
    };
  });
  document.querySelectorAll('input[type="number"][data-id]').forEach(inp=>{
    inp.oninput = ()=>{ state.values[inp.dataset.id] = inp.value===''? undefined : parseFloat(inp.value); };
  });
  document.querySelectorAll('[data-act="yn"]').forEach(b=>{
    b.onclick = ()=>{ state.values[b.dataset.id] = b.dataset.val==='true'; renderCurrentForm(); };
  });
  document.querySelectorAll('[data-act="scale"],[data-act="route"]').forEach(b=>{
    b.onclick = ()=>{ state.values[b.dataset.id] = parseInt(b.dataset.val); renderCurrentForm(); };
  });
  document.querySelectorAll('[data-act="choice"]').forEach(b=>{
    b.onclick = ()=>{ state.values[b.dataset.id] = b.dataset.val; renderCurrentForm(); };
  });
}
function renderCurrentForm(){
  const active = document.activeElement;
  const preserveId = active && active.dataset ? active.dataset.id : null;
  if(state.mode==='station') renderStationForm(); else renderScrimmage();
}

/* ---------------------------------------------------------------
   LOGGING
---------------------------------------------------------------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// Every name/year/position/note/evaluator field is free text someone typed
// (a walk-on name at check-in, a pasted roster, a cut-meeting note) and
// several of those get inserted into innerHTML. Without escaping, a name
// like "<img src=x onerror=...>" would execute as real HTML/script in the
// browser of everyone else viewing that roster — this makes that safe
// regardless of what anyone types, accidentally or otherwise.
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
function baseMeta(){
  return {
    id: uid(),
    ts: new Date().toISOString(),
    evaluator: document.getElementById('evalName').value || '—',
    group: document.getElementById('podLabel').value || '—',
    session: SESSIONS[state.session].label,
    athlete: state.values._athlete ?? '—'
  };
}
function logStationEntry(){
  if(state.values._athlete===undefined || state.values._athlete===null || state.values._athlete===''){
    toast("Enter an athlete # first"); return;
  }
  const st = SESSIONS[state.session].stations[state.station];
  const data = {}; const fields = [];
  st.fields.forEach(f=>{
    if(f.type==='route'){
      f.routes.forEach(r=>{
        const v = state.values[f.id+'_'+r];
        data[r] = v ?? '';
        if(v!==undefined && v!==null) fields.push({label:r, type:'route', value:v});
      });
    } else {
      const v = state.values[f.id];
      data[f.label] = v ?? '';
      if(v!==undefined && v!==null && (f.type==='scale5' || f.type==='num')) fields.push({label:f.label, type:f.type, value:v});
    }
  });
  entries.push({ ...baseMeta(), type:'Station', tag:st.tag, stationCode:st.code, station:st.name, data, fields });
  saveEntries(); renderLog();
  toast(`Logged — ${st.name}, Athlete #${state.values._athlete}`);
  const keepAthlete = state.values._athlete;
  const keepPod = state.values._pod;
  state.values = { _athlete: keepAthlete };
  renderStationForm();
}
function logScrimmageEvent(cat, ev){
  if(state.values._athlete===undefined || state.values._athlete===null || state.values._athlete===''){
    toast("Enter an athlete # first"); return;
  }
  state.runningPts = (state.runningPts||0) + ev.pts;
  entries.push({ ...baseMeta(), type: cat==='fiq'?'FIQ':'Scrimmage +/-', tag: cat==='fiq'?'FIQ':(cat==='offense'?'SCRIM-OFF':'SCRIM-DEF'), station: cat, data:{ event: ev.label, points: ev.pts } });
  saveEntries(); renderLog();
  toast(`${ev.pts>0?'+':''}${ev.pts} — ${ev.label}`);
  renderScrimmage();
}
function logTcsEntry(){
  if(state.values._athlete===undefined || state.values._athlete===null || state.values._athlete===''){
    toast("Enter an athlete # first"); return;
  }
  if(state.values._tcs===undefined){ toast("Pick a TCS score first"); return; }
  entries.push({ ...baseMeta(), type:'TCS', tag:'TCS', station:'TCS', data:{ score: state.values._tcs } });
  saveEntries(); renderLog();
  toast(`TCS ${state.values._tcs} saved — Athlete #${state.values._athlete}`);
}

/* ---------------------------------------------------------------
   LOG VIEW + EXPORT
---------------------------------------------------------------- */
function renderLog(){
  const wrap = document.getElementById('logWrap');
  if(!wrap) return;
  if(!entries.length){ wrap.innerHTML = '<p class="empty">No entries logged yet on this device or synced from others.</p>'; return; }
  const recent = entries.slice(-30).reverse();
  let html = `<div class="logwrap"><table class="logtable"><thead><tr>
    <th>Time</th><th>Day</th><th>Athlete</th><th>Station/Event</th><th>Eval</th><th>Detail</th>
  </tr></thead><tbody>`;
  recent.forEach(e=>{
    const t = new Date(e.ts);
    const timeStr = t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const detail = Object.entries(e.data||{}).map(([k,v])=>`${k}:${v}`).join(' · ');
    html += `<tr><td>${timeStr}</td><td>${e.session}</td><td>#${e.athlete}${nameForPinny(e.athlete)?' '+escapeHtml(nameForPinny(e.athlete)):''}</td><td>${e.stationCode? e.session+e.stationCode+' — ':''}${e.station}</td><td>${escapeHtml(e.evaluator)}</td><td>${detail}</td></tr>`;
  });
  html += `</tbody></table></div><p class="synctag">Showing last 30 of ${entries.length} synced entries.</p>`;
  wrap.innerHTML = html;
}
function nameForPinny(pinny){
  const a = roster.find(r=> String(r.pinny)===String(pinny));
  return a ? a.name : null;
}
// A name/note starting with =, +, -, or @ can be interpreted as a formula
// by Excel/Sheets when the CSV is opened — a leading apostrophe is the
// standard way to force it to display as plain text instead of executing.
function csvSafe(v){
  const s = String(v ?? '');
  return /^[=+\-@]/.test(s) ? "'" + s : s;
}
function toCsv(){
  const cols = ['ts','session','athlete','athleteName','evaluator','group','type','station','data'];
  const rows = [cols.join(',')];
  entries.forEach(e=>{
    const row = [e.ts,e.session,e.athlete, csvSafe(nameForPinny(e.athlete)||''), csvSafe(e.evaluator),csvSafe(e.group),e.type,e.station, JSON.stringify(e.data).replace(/"/g,'""')];
    rows.push(row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  return rows.join('\n');
}
function exportCsv(){
  const blob = new Blob([toCsv()], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `geegees-tryout-log-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------------
   SIMULATION / DRY-RUN TOOLS
   Generates plausible station + scrimmage entries for the real
   roster, spread across 5 evaluators (EV1–EV5, one per station),
   and writes them to the same shared backend evaluators use.
   For test data only — pair with Clear All Synced Data before
   the real tryout day.
---------------------------------------------------------------- */
function randRange(min,max){ return +(Math.random()*(max-min)+min).toFixed(2); }
function simulateFieldValue(f){
  if(f.type==='num'){
    const id=(f.id||'').toLowerCase();
    if(f.unit && f.unit.startsWith('/')){
      const max = parseInt(f.unit.slice(1))||5;
      return Math.max(0, Math.min(max, Math.round(randRange(max*0.5,max))));
    }
    if(f.unit==='sec'){
      if(id.includes('t40')) return randRange(5.0,6.8);
      if(id.includes('split10')) return randRange(1.5,2.2);
      if(id.includes('shuttle')) return randRange(4.5,5.8);
      if(id.includes('progtime')) return randRange(1.0,2.5);
      if(id.includes('timetopull')) return randRange(0.8,2.0);
      return randRange(0.8,3.5);
    }
    if(f.unit==='in'){
      if(id.includes('reach')) return randRange(78,92);
      if(id.includes('touch')) return randRange(98,118);
      return randRange(60,100);
    }
    if(f.unit==='ct') return Math.floor(Math.random()*3);
    return Math.floor(Math.random()*4);
  }
  if(f.type==='yn') return Math.random()<0.7;
  if(f.type==='scale5') return Math.floor(Math.random()*3)+3;
  if(f.type==='choice') return f.options[Math.floor(Math.random()*f.options.length)];
  return '';
}
function generateSimulatedDay(sessionNum){
  const sess = SESSIONS[sessionNum];
  const pods = ['A','B','C','D','E'];
  let tsBase = Date.now() - 1000*60*70;
  // Simulate whoever's actually registered (everyone with a pinnie in the
  // Sign-In roster) — not just the fixed 27-person seed list. Falls back to
  // the seed roster only if nobody's been registered yet (e.g. testing
  // stations before running registration at all).
  const registered = roster.filter(a=>a.pinny);
  const simRoster = registered.length ? registered.map(a=>({name:a.name, num:a.pinny})) : ROSTER;
  const pinnyFor = (ath)=>{
    const match = roster.find(r=> r.name.trim().toLowerCase() === ath.name.trim().toLowerCase());
    return (match && match.pinny) ? match.pinny : ath.num;
  };
  if(sess.stations.length){
    simRoster.forEach((ath, idx)=>{
      const athleteNum = pinnyFor(ath);
      const pod = pods[idx%5];
      sess.stations.forEach((st, si)=>{
        const evaluator = 'EV'+(si+1);
        const data={}, fields=[];
        st.fields.forEach(f=>{
          if(f.type==='route'){
            f.routes.forEach(r=>{
              const v = Math.floor(Math.random()*3)+3;
              data[r]=v; fields.push({label:r, type:'route', value:v});
            });
          } else {
            const v = simulateFieldValue(f);
            data[f.label]=v;
            if(f.type==='scale5' || f.type==='num') fields.push({label:f.label, type:f.type, value:v});
          }
        });
        tsBase += 1000*15;
        entries.push({ id:uid(), ts:new Date(tsBase).toISOString(), evaluator, group:pod,
          session: sess.label, athlete: athleteNum, type:'Station', tag:st.tag, stationCode:st.code, station:st.name, data, fields });
      });
      if(sess.scrimmage && Math.random()<0.85){
        const n = Math.floor(Math.random()*3)+1;
        for(let i=0;i<n;i++){
          const cat = Math.random()<0.5 ? 'offense':'defense';
          const list = SCRIMMAGE_EVENTS[cat];
          const ev = list[Math.floor(Math.random()*list.length)];
          tsBase += 1000*20;
          entries.push({ id:uid(), ts:new Date(tsBase).toISOString(), evaluator:'EV-SCRIM', group:pod,
            session:sess.label, athlete:athleteNum, type:'Scrimmage +/-', tag: cat==='offense'?'SCRIM-OFF':'SCRIM-DEF', station:cat,
            data:{ event:ev.label, points:ev.pts } });
        }
        tsBase += 1000*10;
        entries.push({ id:uid(), ts:new Date(tsBase).toISOString(), evaluator:'EV-SCRIM', group:pod,
          session:sess.label, athlete:athleteNum, type:'TCS', tag:'TCS', station:'TCS', data:{ score: Math.floor(Math.random()*2)+3 } });
      }
    });
  } else {
    simRoster.forEach((ath, idx)=>{
      const athleteNum = pinnyFor(ath);
      const pod = pods[idx%5];
      const n = Math.floor(Math.random()*4)+2;
      for(let i=0;i<n;i++){
        const cat = Math.random()<0.5 ? 'offense':'defense';
        const list = SCRIMMAGE_EVENTS[cat];
        const ev = list[Math.floor(Math.random()*list.length)];
        tsBase += 1000*20;
        entries.push({ id:uid(), ts:new Date(tsBase).toISOString(), evaluator:'EV-SCRIM', group:pod,
          session:sess.label, athlete:athleteNum, type:'Scrimmage +/-', tag: cat==='offense'?'SCRIM-OFF':'SCRIM-DEF', station:cat,
          data:{ event:ev.label, points:ev.pts } });
      }
      tsBase += 1000*10;
      entries.push({ id:uid(), ts:new Date(tsBase).toISOString(), evaluator:'EV-SCRIM', group:pod,
        session:sess.label, athlete:athleteNum, type:'TCS', tag:'TCS', station:'TCS', data:{ score: Math.floor(Math.random()*2)+3 } });
    });
  }
  return simRoster.length;
}
async function runSimulation(sessionNum){
  const n = generateSimulatedDay(sessionNum);
  const res = await saveEntries();
  if(res===false) toast(`Simulated ${SESSIONS[sessionNum].label} but the save didn't sync — check connection and try again`);
  else toast(`Simulated ${SESSIONS[sessionNum].label} — 5 evaluators × ${n} athletes`);
  renderCoachLog(); renderSnapshot(); renderLiveTotals();
}
async function runSimulationAllSessions(){
  const btn = document.getElementById('simRunAllBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Simulating…'; }
  // Generate all 7 days' data in memory first, then write it ONCE at the end
  // rather than once per day. Seven back-to-back writes to the same key in
  // under two seconds is exactly the kind of burst that can trip a backend
  // write-rate limit or hit a transient network hiccup — this removes that
  // risk entirely instead of hoping each of seven rapid saves succeeds.
  Object.keys(SESSIONS).forEach(key=> generateSimulatedDay(parseInt(key)));
  let ok = await saveEntries();
  if(!ok){
    await new Promise(r=>setTimeout(r, 800));
    ok = await saveEntries(); // one retry — covers a transient failure
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Simulate All 7 Days'; }
  if(ok) toast(`Simulated all 7 days for ${(roster.filter(a=>a.pinny).length || ROSTER.length)} athletes`);
  else toast(`Generated all 7 days locally, but the save still didn't sync after retrying — check connection and try Refresh`);
  renderCoachLog(); renderSnapshot(); renderLiveTotals();
}
async function clearAllEntries(){
  if(!await customConfirm('This clears every synced entry for all evaluators (test or real). Use this to reset the log before the actual tryout. Continue?')) return;
  entries = [];
  await saveEntries();
  toast('Synced log cleared');
  renderCoachLog(); renderSnapshot(); renderLiveTotals();
}

/* ---------------------------------------------------------------
   HEAD COACH DASHBOARD
   Reads the same shared backend — no separate data, just a
   different view: totals, filters, and a per-athlete snapshot
   built from Section 7.1's Quick Reference Model.
---------------------------------------------------------------- */
let coachFilters = { session:'all', type:'all', athlete:'' };

function sessionCounts(){
  const counts = {};
  Object.values(SESSIONS).forEach(s=>counts[s.label]=0);
  entries.forEach(e=>{ if(counts[e.session]!==undefined) counts[e.session]++; });
  return counts;
}
function filteredEntries(){
  return entries.filter(e=>{
    if(coachFilters.session!=='all' && e.session!==coachFilters.session) return false;
    if(coachFilters.type!=='all' && e.type!==coachFilters.type) return false;
    if(coachFilters.athlete!=='' && String(e.athlete)!==String(coachFilters.athlete)) return false;
    return true;
  });
}
function computeSnapshot(athleteNum){
  const rows = entries.filter(e=> String(e.athlete)===String(athleteNum));
  if(!rows.length) return null;
  const combine=[]; let skillSum=0, skillCount=0, compete=0, tcsSum=0, tcsCount=0;
  rows.forEach(e=>{
    if(e.type==='Station' && e.tag==='COMBINE'){
      Object.entries(e.data).forEach(([k,v])=>{ if(v!=='' && v!==null && v!==undefined) combine.push(`${e.session} ${k}: ${v}`); });
    }
    if(e.fields) e.fields.forEach(f=>{
      if(f.type==='scale5' || f.type==='route'){ skillSum += Number(f.value); skillCount++; }
    });
    if(e.type==='Scrimmage +/-' || e.type==='FIQ') compete += Number(e.data.points)||0;
    if(e.type==='TCS'){ tcsSum += Number(e.data.score)||0; tcsCount++; }
  });
  return {
    total: rows.length, combine,
    skillAvg: skillCount ? (skillSum/skillCount).toFixed(2) : '—',
    compete: compete>0? '+'+compete : compete,
    tcsAvg: tcsCount ? (tcsSum/tcsCount).toFixed(2) : '—',
    rows: rows.slice().reverse()
  };
}
function stationBreakdown(){
  const dayLabels = Object.values(SESSIONS).map(s=>s.label);
  const stationCodes = ['S1','S2','S3','S4','S5'];
  const rowKeys = [...stationCodes, 'Scrimmage +/-', 'TCS', 'FIQ'];
  const matrix = {};
  rowKeys.forEach(rk=>{ matrix[rk] = {}; dayLabels.forEach(d=>matrix[rk][d]=0); });
  entries.forEach(e=>{
    if(e.type==='Station' && e.stationCode && matrix[e.stationCode] && matrix[e.stationCode][e.session]!==undefined){
      matrix[e.stationCode][e.session]++;
    } else if(matrix[e.type] && matrix[e.type][e.session]!==undefined){
      matrix[e.type][e.session]++;
    }
  });
  const totals = {};
  dayLabels.forEach(d=>{ totals[d] = rowKeys.reduce((sum,rk)=> sum + matrix[rk][d], 0); });
  return { dayLabels, rowKeys, matrix, totals };
}
function renderLiveTotals(){
  const el = document.getElementById('liveTotalsGrid');
  if(!el) return;
  const counts = sessionCounts();
  el.innerHTML = Object.entries(counts).map(([label,n])=>
    `<div class="statbox"><span class="n">${n}</span><span class="l">${label}</span></div>`).join('');
  const brk = document.getElementById('stationBreakdownWrap');
  if(brk){
    const {dayLabels, rowKeys, matrix, totals} = stationBreakdown();
    let html = `<div style="overflow-x:auto"><table class="roster"><thead><tr><th>Type</th>` +
      dayLabels.map(d=>`<th>${d}</th>`).join('') + `</tr></thead><tbody>`;
    rowKeys.forEach(rk=>{
      html += `<tr><td>${rk}</td>` + dayLabels.map(d=>`<td>${matrix[rk][d]}</td>`).join('') + `</tr>`;
    });
    html += `<tr style="font-weight:800;border-top:2px solid var(--line)"><td>Total</td>` +
      dayLabels.map(d=>`<td>${totals[d]}</td>`).join('') + `</tr>`;
    html += `</tbody></table></div>`;
    brk.innerHTML = html;
  }
}
function renderCoachDashboard(){
  const main = document.getElementById('mainArea');

  const typeOptions = ['all','Station','Scrimmage +/-','FIQ','TCS'];
  let html = `<details class="card"><summary>Test Tools (dry-run before tryout day)</summary>
    <p class="focus" style="margin-top:8px">Simulates every currently-registered athlete (falls back to the 27-person seed roster if nobody's registered yet). Entries use evaluators EV1–EV5 (one per station) plus EV-SCRIM for scrimmage/TCS, so they're easy to spot and clear before the real thing.</p>
    <div class="filterbar">

  <div class="card"><h2>Live Totals</h2>

   MAIN RENDER
---------------------------------------------------------------- */
/* ---------------------------------------------------------------
   SIGN-IN & PINNIE ASSIGNMENT
   Shares the same top session tabs (S1–S7) as the day selector.
   Separate storage key from tryout entries — this is roster +
   attendance + pinnie identity, not station data.
---------------------------------------------------------------- */
const CHECKIN_KEY = 'geegees-checkin-roster';
let roster = [];
let rosterSyncing = false;
// See decisionsWriteChain above — same reasoning, same fix.
let rosterWriteChain = Promise.resolve();
state.checkinSearch = '';
state.checkinShowLoader = true;
state.checkinUnpaidOnly = false;
state.walkOnName = '';
state.walkOnYear = '';
state.walkOnPos = [];
state.walkOnPinny = '';

function interpretPaid(raw){
  if(raw===undefined || raw===null) return undefined;
  const v = String(raw).trim().toLowerCase();
  if(['paid','y','yes','true','1','✓','x'].includes(v)) return true;
  if(['unpaid','n','no','false','0','owing','due'].includes(v)) return false;
  return undefined;
}
function looksLikeHeaderRow(cols){
  const first = (cols[0]||'').trim().toLowerCase();
  const rest = cols.slice(1).map(c=>c.trim().toLowerCase());
  return ['#','no','no.','num','number'].includes(first) && rest.includes('name');
}
function parseRosterText(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>l.length)
    .filter(line=> !looksLikeHeaderRow(line.split('\t')))
    .map((line, idx)=>{
    const cols = line.split('\t').map(c=>c.trim());
    let listNum, name, year, posCols, paidRaw;
    if(cols.length>=4 && /^\d+$/.test(cols[0])){
      listNum=parseInt(cols[0]); name=cols[1]; year=cols[2]; posCols=cols.slice(3);
    } else if(cols.length>=3){
      listNum=idx+1; name=cols[0]; year=cols[1]; posCols=cols.slice(2);
    } else {
      listNum=idx+1; name=cols[0]||line; year=''; posCols=[];
    }
    // A trailing column that reads as a payment indicator (Paid/Unpaid/Y/N/etc.)
    // gets split off instead of getting folded into the position text.
    if(posCols.length>1 && interpretPaid(posCols[posCols.length-1])!==undefined){
      paidRaw = posCols[posCols.length-1];
      posCols = posCols.slice(0,-1);
    }
    return { listNum, name, year, pos: posCols.join(', '), paidRaw };
  }).filter(r=>r.name);
}
async function withFreshRoster(mutator){
  // OPTIMISTIC PASS: apply the change to what's already on screen and
  // render immediately — this is what makes the tap feel instant instead
  // of waiting on a full round trip to Google's servers (often 1-3+
  // seconds each way) before anything visibly changes.
  try{ roster = mutator(roster.slice()) || roster; }catch(e){}
  renderCheckinMain();

  // AUTHORITATIVE PASS: queued behind any earlier not-yet-finished calls
  // (see decisionsWriteChain) — without this, rapidly editing several
  // different athletes back-to-back would let whichever save finishes last
  // overwrite the others with a stale snapshot that never saw them.
  rosterWriteChain = rosterWriteChain.then(async ()=>{
    let current;
    try{
      const res = await cloudGet(CHECKIN_KEY);
      current = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ current = roster.slice(); }
    const updated = mutator(current) || current;
    // MERGE, don't blindly overwrite — see withFreshDecisions for the full
    // reasoning. Same fix, same underlying pattern.
    roster = mergeRoster(roster, updated);
    try{
      const res = await storageSet(CHECKIN_KEY, JSON.stringify(roster), true);
      if(!res) toast('Saved locally — sync failed');
    }catch(e){ toast('Saved locally — sync failed'); }
    renderCheckinMain();
  });
  await rosterWriteChain;
}
async function loadRosterFromCloud(){
  try{
    const res = await cloudGet(CHECKIN_KEY);
    roster = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ roster = []; }
}
// Same reasoning as mergeDecisions — never blindly overwrite. Roster
// records don't have one single "last modified" field, so this derives
// one from whichever sub-fields actually carry a timestamp (pinnie
// assignment, payment, check-in time) and keeps whichever side touched
// that athlete more recently, per athlete.
function athleteLastModified(a){
  const times = [a.pinnyAssignedAt, a.paidAt].filter(Boolean);
  if(a.attendance) Object.values(a.attendance).forEach(rec=>{ if(rec && rec.time) times.push(rec.time); });
  if(!times.length) return 0;
  return Math.max(...times.map(t=>new Date(t).getTime()));
}
function mergeRoster(local, fresh){
  const byListNum = new Map();
  fresh.forEach(a=> byListNum.set(a.listNum, a));
  local.forEach(a=>{
    const f = byListNum.get(a.listNum);
    if(!f){ byListNum.set(a.listNum, a); return; }
    const lt = athleteLastModified(a), ft = athleteLastModified(f);
    byListNum.set(a.listNum, lt >= ft ? a : f);
  });
  return Array.from(byListNum.values());
}
async function backgroundPollRoster(){
  if(rosterSyncing) return; rosterSyncing = true;
  try{
    const res = await cloudGet(CHECKIN_KEY);
    const fresh = res && res.value ? JSON.parse(res.value) : [];
    const merged = mergeRoster(roster, fresh);
    const changed = JSON.stringify(merged) !== JSON.stringify(roster);
    if(changed){
      roster = merged;
      if(state.viewMode==='checkin'){
        // Prefer the lightweight table-only refresh so it never disturbs
        // whatever's focused (e.g. mid-typing in the search box). Only
        // fall back to a full rebuild if the table structure doesn't exist
        // yet (roster just went from empty to populated).
        if(document.getElementById('checkinTableWrap')) renderCheckinTable();
        else renderCheckinMain();
      }
    }
    updateSyncStatus('live');
  }catch(e){ updateSyncStatus('offline'); }
  rosterSyncing = false;
}
setInterval(backgroundPollRoster, 6000);

function wireWalkOnInputs(){
  document.getElementById('walkOnName').oninput = (e)=>{ state.walkOnName = e.target.value; };
  document.getElementById('walkOnYear').oninput = (e)=>{ state.walkOnYear = e.target.value; };
  document.getElementById('walkOnPinny').oninput = (e)=>{ state.walkOnPinny = e.target.value; };
  document.querySelectorAll('[data-walkonpos]').forEach(cb=>{
    cb.onchange = ()=>{
      const p = cb.dataset.walkonpos;
      const i = state.walkOnPos.indexOf(p);
      if(cb.checked && i<0) state.walkOnPos.push(p);
      else if(!cb.checked && i>=0) state.walkOnPos.splice(i,1);
    };
  });
  document.getElementById('addWalkOnBtn').onclick = ()=> addWalkOn(state.walkOnName, state.walkOnYear, state.walkOnPos, state.walkOnPinny);
}
let listNumCounter = 0;
function uniqueListNum(current){
  // Deliberately NOT "highest existing + 1" — that's exactly what let two
  // devices, each working from a roster snapshot that didn't yet include
  // the other's just-added athlete, independently compute and assign the
  // same "next" number (confirmed directly: listNum 30 ended up shared by
  // three different athletes in real testing).
  // A monotonic counter combined with the timestamp guarantees this never
  // collides with itself even across many calls in a tight loop within the
  // same millisecond (confirmed by testing: timestamp+random alone did
  // collide under 200 rapid-fire calls) — the check against `current` is
  // extra defense specifically for the cross-device case.
  let n;
  do{
    listNumCounter++;
    // NOTE: the multiplier must keep the result under Number.MAX_SAFE_INTEGER
    // (2^53). Date.now() is ~13 digits; ×10000 would push past the safe
    // integer limit and silently lose precision, making small counter
    // increments round to the same value — confirmed by testing (500 rapid
    // calls collided with a ×10000 multiplier). ×1000 stays safely within range.
    n = Date.now()*1000 + (listNumCounter % 1000);
  } while(current.some(a=>a.listNum===n));
  return n;
}
async function addWalkOn(name, year, positions, pinnyRaw){
  name = (name||'').trim();
  if(!name){ toast('Enter a name first'); return; }
  const pos = (positions||[]).join(', ');
  let pinny = null;
  const trimmedPinny = String(pinnyRaw||'').trim();
  if(trimmedPinny!==''){
    const n = parseInt(trimmedPinny);
    if(isNaN(n) || n<1){ toast('Enter a valid pinnie number, or leave it blank'); return; }
    pinny = n;
  }
  let added = true;
  await withFreshRoster(current=>{
    if(current.some(a=>a.name.trim().toLowerCase()===name.toLowerCase())){
      toast(`${name} is already on the roster`); added = false; return current;
    }
    if(pinny!==null){
      const conflict = current.find(a=>a.pinny===pinny);
      if(conflict){ toast(`Pinnie #${pinny} is already assigned to ${conflict.name}`); added = false; return current; }
    }
    const nextListNum = uniqueListNum(current);
    current.push({ listNum:nextListNum, name, year:(year||'').trim(), pos,
      pinny, pinnyAssignedAt: pinny? new Date().toISOString() : null, paid:false, paidAt:null, attendance:{} });
    return current;
  });
  if(added){
    toast(`${name} added to the roster${pinny? ' with pinnie #'+pinny : ''} — check them in below`);
    state.walkOnName = ''; state.walkOnYear = ''; state.walkOnPos = []; state.walkOnPinny = '';
  }
}
async function loadOrUpdateRoster(text){
  const parsed = parseRosterText(text);
  if(!parsed.length){ toast('No rows found — check the pasted text'); return; }
  let paidStatusesSet = 0;
  await withFreshRoster(current=>{
    const byName = new Map(current.map(a=>[a.name.trim().toLowerCase(), a]));
    parsed.forEach(p=>{
      const key = p.name.trim().toLowerCase();
      const paidVal = interpretPaid(p.paidRaw);
      if(byName.has(key)){
        const existing = byName.get(key);
        existing.listNum = p.listNum; existing.year = p.year; existing.pos = p.pos;
        if(paidVal !== undefined && existing.paid !== paidVal){
          existing.paid = paidVal;
          existing.paidAt = paidVal ? (existing.paidAt || new Date().toISOString()) : null;
          paidStatusesSet++;
        }
      } else {
        const paid = paidVal===true;
        const listNumTaken = current.some(a=>a.listNum===p.listNum);
        const safeListNum = listNumTaken ? uniqueListNum(current) : p.listNum;
        current.push({ listNum:safeListNum, name:p.name, year:p.year, pos:p.pos,
          pinny:null, pinnyAssignedAt:null, paid, paidAt: paid?new Date().toISOString():null, attendance:{} });
        if(paidVal !== undefined) paidStatusesSet++;
      }
    });
    return current;
  });
  toast(`Roster loaded — ${parsed.length} rows processed${paidStatusesSet?`, ${paidStatusesSet} payment statuses set`:''}`);
  state.checkinShowLoader = false;
  renderCheckinMain();
}
async function toggleCheckin(listNum){
  const day = SESSIONS[state.session].label;
  await withFreshRoster(current=>{
    const a = current.find(x=>x.listNum===listNum);
    if(!a) return current;
    a.attendance = a.attendance || {};
    const wasIn = a.attendance[day] && a.attendance[day].in;
    if(!wasIn){
      // Checking someone in clears any Notified Absence for the day —
      // the two are mutually exclusive.
      a.attendance[day] = { in:true, na:false, time:new Date().toISOString() };
      if(!a.pinny){
        const used = new Set(current.filter(x=>x.pinny).map(x=>x.pinny));
        let n=1; while(used.has(n)) n++;
        a.pinny = n; a.pinnyAssignedAt = new Date().toISOString();
      }
    } else {
      a.attendance[day] = { in:false, na:false, time:a.attendance[day].time };
    }
    return current;
  });
}
async function toggleNotifiedAbsence(listNum){
  const day = SESSIONS[state.session].label;
  await withFreshRoster(current=>{
    const a = current.find(x=>x.listNum===listNum);
    if(!a) return current;
    a.attendance = a.attendance || {};
    const wasNA = a.attendance[day] && a.attendance[day].na;
    if(!wasNA){
      // Marking NA clears Present for the day — mutually exclusive, and
      // deliberately does NOT touch pinnie assignment (an athlete who's
      // notified they can't make it today doesn't need one assigned yet).
      a.attendance[day] = { in:false, na:true, time:new Date().toISOString() };
    } else {
      a.attendance[day] = { in:false, na:false, time:a.attendance[day].time };
    }
    return current;
  });
}
async function bulkCheckIn(){
  const day = SESSIONS[state.session].label;
  const targets = filteredRoster()
    .filter(a=> !(a.attendance && a.attendance[day] && a.attendance[day].na))
    .map(a=>a.listNum);
  if(!targets.length){ toast('No athletes match the current filter (or all visible are marked Notified Absent)'); return; }
  if(!await customConfirm(`Check in ${targets.length} athlete(s) for ${day}? Anyone not already checked in will be marked present, and assigned a pinnie if they don't have one yet. Athletes marked Notified Absent are skipped.`)) return;
  let checkedCount = 0;
  await withFreshRoster(current=>{
    const used = new Set(current.filter(x=>x.pinny).map(x=>x.pinny));
    targets.forEach(listNum=>{
      const a = current.find(x=>x.listNum===listNum);
      if(!a) return;
      a.attendance = a.attendance || {};
      if(!(a.attendance[day] && a.attendance[day].in)){
        a.attendance[day] = { in:true, na:false, time:new Date().toISOString() };
        if(!a.pinny){
          let n=1; while(used.has(n)) n++;
          a.pinny = n; used.add(n); a.pinnyAssignedAt = new Date().toISOString();
        }
        checkedCount++;
      }
    });
    return current;
  });
  toast(`Checked in ${checkedCount} athlete(s) for ${day}`);
}
async function togglePaid(listNum){
  await withFreshRoster(current=>{
    const a = current.find(x=>x.listNum===listNum);
    if(!a) return current;
    a.paid = !a.paid;
    a.paidAt = a.paid ? new Date().toISOString() : null;
    return current;
  });
}
async function assignNextAvailablePinny(listNum){
  await withFreshRoster(current=>{
    const a = current.find(x=>x.listNum===listNum);
    if(!a || a.pinny) return current;
    const used = new Set(current.filter(x=>x.pinny).map(x=>x.pinny));
    let n=1; while(used.has(n)) n++;
    a.pinny = n; a.pinnyAssignedAt = new Date().toISOString();
    return current;
  });
  toast(`Assigned pinnie #${roster.find(r=>r.listNum===listNum).pinny}`);
}
async function setPinnyManually(listNum, newVal){
  const trimmed = String(newVal).trim();
  if(trimmed===''){
    await withFreshRoster(current=>{
      const a = current.find(x=>x.listNum===listNum);
      if(a){ a.pinny=null; a.pinnyAssignedAt=null; }
      return current;
    });
    toast('Pinnie cleared');
    return;
  }
  const n = parseInt(trimmed);
  if(isNaN(n) || n<1){ toast('Enter a valid pinnie number'); renderCheckinMain(); return; }
  await withFreshRoster(current=>{
    const conflict = current.find(x=>x.pinny===n && x.listNum!==listNum);
    if(conflict){ toast(`Pinnie #${n} is already assigned to ${conflict.name}`); return current; }
    const a = current.find(x=>x.listNum===listNum);
    if(a){ a.pinny=n; a.pinnyAssignedAt = a.pinnyAssignedAt || new Date().toISOString(); }
    return current;
  });
}
async function removeAthlete(listNum, name){
  if(!await customConfirm(`Remove ${name} from the roster entirely? This can't be undone.`)) return;
  let removedPinny = null;
  await withFreshRoster(current=>{
    const found = current.find(x=>x.listNum===listNum);
    if(found) removedPinny = found.pinny;
    return current.filter(x=>x.listNum!==listNum);
  });
  if(removedPinny) await clearDecision(removedPinny);
  toast(`${name} removed`);
}
async function clearTodayCheckins(){
  const day = SESSIONS[state.session].label;
  if(!await customConfirm(`Clear all check-ins for ${day}? Pinnie numbers stay assigned. This can't be undone.`)) return;
  await withFreshRoster(current=>{ current.forEach(a=>{ if(a.attendance) delete a.attendance[day]; }); return current; });
  toast(`${day} check-ins cleared`);
}
async function simulateRegistration(){
  const day = SESSIONS[state.session].label;
  const walkins = Array.from({length:20}, (_,i)=>({
    listNum: 28+i, name:`Walk-In ${i+1}`, year:'Walk-in', pos:'Unassigned'
  }));
  const seedRows = ROSTER.map(a=>({listNum:a.num, name:a.name, year:a.year, pos:a.pos})).concat(walkins);

  await withFreshRoster(current=>{
    const byName = new Map(current.map(a=>[a.name.trim().toLowerCase(), a]));
    seedRows.forEach(p=>{
      const key = p.name.trim().toLowerCase();
      if(byName.has(key)){
        const existing = byName.get(key);
        existing.listNum = p.listNum; existing.year = p.year; existing.pos = p.pos;
      } else {
        const rec = { listNum:p.listNum, name:p.name, year:p.year, pos:p.pos, pinny:null, pinnyAssignedAt:null, paid:false, paidAt:null, attendance:{} };
        current.push(rec);
        byName.set(key, rec);
      }
    });
    // Random unique 1–3 digit pinnies (1–999), not sequential — this is meant to
    // stress-test the conflict logic the way real walk-in registration would,
    // where numbers get handed out in whatever order people show up.
    const usedNumbers = new Set(current.filter(a=>a.pinny).map(a=>a.pinny));
    seedRows.forEach(p=>{
      const rec = byName.get(p.name.trim().toLowerCase());
      if(rec.pinny) usedNumbers.delete(rec.pinny);
    });
    seedRows.forEach(p=>{
      const rec = byName.get(p.name.trim().toLowerCase());
      let n;
      do{ n = Math.floor(Math.random()*999)+1; }while(usedNumbers.has(n));
      usedNumbers.add(n);
      rec.pinny = n; rec.pinnyAssignedAt = new Date().toISOString();
      rec.attendance = rec.attendance || {};
      rec.attendance[day] = { in:true, time:new Date().toISOString() };
      // Realistic payment mix for testing: ~75% paid, rest still owing.
      rec.paid = Math.random() < 0.75;
      rec.paidAt = rec.paid ? new Date().toISOString() : null;
    });
    return current;

function exportCheckinCsv(){

/* ---------------------------------------------------------------
   TEAM SELECTION — compare athletes and decide Team 1 / Team 2 /
   Reserve / Release. Joins the Sign-In roster (identity + pinnie)
   with the same skill/compete/TCS metrics the Head Coach dashboard
   computes from station + scrimmage entries, keyed by pinnie —
   the same "Athlete #" evaluators type at every station.
   Decisions live in their own shared key so they persist
   independently of the roster and the raw station data.
---------------------------------------------------------------- */
const DECISIONS_KEY = 'geegees-roster-decisions';
let decisions = {};
let decisionsSyncing = false;
// Serializes the authoritative fetch-mutate-save step so that rapid,
// overlapping decisions (tap Team 1 for one player, then immediately move
// on to the next few before the first has finished saving) can't stomp
// each other — each one now waits for every earlier one to actually finish
// before it fetches "fresh," so it never works from a snapshot that's
// missing someone else's still-in-flight decision.
let decisionsWriteChain = Promise.resolve();
state.selectionSearch = '';
state.selectionStatusFilter = 'all';
state.selectionSort = 'name';
state.selectionPositionFilter = 'all';
state.compareQuery = '';
state.compareList = [];
state.compareMatches = [];

const DECISION_LABELS = { team1:'Team 1', team2:'Team 2', reserve:'Reserve', release:'Release' };
function statusLabel(status){ return DECISION_LABELS[status] || 'Undecided'; }

async function withFreshDecisions(mutator){
  // OPTIMISTIC PASS: still instant, still runs immediately regardless of
  // whatever else is mid-flight — see withFreshRoster's comment.
  try{ decisions = mutator({...decisions}) || decisions; }catch(e){}
  renderSelectionMain();

  // AUTHORITATIVE PASS: queued behind any earlier not-yet-finished calls,
  // so this one's "fetch fresh" always reflects every decision made before
  // it, not just the ones whose round trip happened to finish first.
  decisionsWriteChain = decisionsWriteChain.then(async ()=>{
    let current;
    try{
      const res = await cloudGet(DECISIONS_KEY);
      current = res && res.value ? JSON.parse(res.value) : {};
    }catch(e){ current = {...decisions}; }
    const updated = mutator(current) || current;
    // MERGE, don't blindly overwrite: `updated` only reflects THIS action's
    // effect on top of a fetch that predates other still-in-flight clicks —
    // it has no idea about a different decision someone else made a moment
    // ago that hasn't reached ITS OWN authoritative turn yet. A blind
    // assignment here would erase that pending click until its own turn
    // came up seconds later. Confirmed directly: clicking three players in
    // quick succession showed the 2nd and 3rd as unselected for over a
    // second, purely from this pattern, even though nothing was ever lost
    // from the eventual saved result.
    decisions = mergeDecisions(decisions, updated);
    try{
      const res = await storageSet(DECISIONS_KEY, JSON.stringify(decisions), true);
      if(!res) toast('Saved locally — sync failed');
    }catch(e){ toast('Saved locally — sync failed'); }
    renderSelectionMain();
  });
  await decisionsWriteChain;
}
async function loadDecisionsFromCloud(){
  try{
    const res = await cloudGet(DECISIONS_KEY);
    decisions = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ decisions = {}; }
}
// Merges by pinny, never blindly overwrites: for each athlete present on
// either side, keeps whichever decision is actually more recent
// (decidedAt). Without this, a decision still mid-flight through the
// write queue (not yet actually saved) could get silently wiped by this
// poll fetching an older snapshot — and critically, nothing would ever
// re-correct it afterward, since the poll doesn't know a save is pending.
// Confirmed directly: assigning Team 1, then having a poll land before
// that save completes, wiped it permanently even though the save itself
// went on to succeed in the backend.
function mergeDecisions(local, fresh){
  const merged = {...fresh};
  Object.keys(local).forEach(pinny=>{
    const l = local[pinny], f = fresh[pinny];
    if(!f){ merged[pinny] = l; return; }
    const lt = l && l.decidedAt ? new Date(l.decidedAt).getTime() : 0;
    const ft = f && f.decidedAt ? new Date(f.decidedAt).getTime() : 0;
    merged[pinny] = lt >= ft ? l : f;
  });
  return merged;
}
async function backgroundPollDecisions(){
  if(decisionsSyncing) return; decisionsSyncing = true;
  try{
    const res = await cloudGet(DECISIONS_KEY);
    const fresh = res && res.value ? JSON.parse(res.value) : {};
    const merged = mergeDecisions(decisions, fresh);
    const changed = JSON.stringify(merged) !== JSON.stringify(decisions);
    if(changed){
      decisions = merged;
      if(state.viewMode==='selection'){
        if(document.getElementById('selectionTableWrap')) renderSelectionTable();
        else renderSelectionMain();
      }
    }
    updateSyncStatus('live');
  }catch(e){ updateSyncStatus('offline'); }
  decisionsSyncing = false;
}
setInterval(backgroundPollDecisions, 6000);

async function assignDecision(pinny, status){
  const athlete = roster.find(r=>r.pinny===pinny);
  await withFreshDecisions(current=>{
    const existingNote = current[pinny] ? (current[pinny].note || '') : '';
    current[pinny] = { status, decidedAt: new Date().toISOString(), name: athlete ? athlete.name : null, note: existingNote };
    return current;
  });
}
async function setDecisionNote(pinny, note){
  const athlete = roster.find(r=>r.pinny===pinny);
  await withFreshDecisions(current=>{
    if(!current[pinny]) current[pinny] = { status:null, decidedAt:null, name: athlete?athlete.name:null, note:'' };
    current[pinny].note = note;
    current[pinny].name = athlete ? athlete.name : current[pinny].name;
    return current;
  });
}
async function clearDecision(pinny){
  await withFreshDecisions(current=>{ delete current[pinny]; return current; });
}
// A pinnie can be reassigned to a different person entirely (roster reset,
// re-registration, or just correcting a mistake), and nothing about the
// decisions store on its own knows that happened. Rather than trust a raw
// pinnie match, every read of a decision is checked against the name it was
// recorded under — if the name on file no longer matches whoever currently
// holds that pinnie, it's treated as no decision rather than silently
// handed to the wrong athlete.
function decisionFor(pinny, currentName){
  const d = decisions[pinny];
  if(!d) return null;
  if(d.name && currentName && d.name.trim().toLowerCase() !== currentName.trim().toLowerCase()) return null;
  return d;
}
function computeSelectionMetrics(pinny){
  const rows = entries.filter(e=> String(e.athlete)===String(pinny));
  let skillSum=0, skillCount=0, compete=0, tcsSum=0, tcsCount=0;
  rows.forEach(e=>{
    if(e.fields) e.fields.forEach(f=>{ if(f.type==='scale5' || f.type==='route'){ skillSum += Number(f.value); skillCount++; } });
    if(e.type==='Scrimmage +/-' || e.type==='FIQ') compete += Number(e.data.points)||0;
    if(e.type==='TCS'){ tcsSum += Number(e.data.score)||0; tcsCount++; }
  });
  return {
    reps: rows.length,
    skillAvg: skillCount ? skillSum/skillCount : null,
    compete,
    tcsAvg: tcsCount ? tcsSum/tcsCount : null
  };
}
function selectionRoster(){
  return roster.filter(a=>a.pinny).map(a=>{
    const dec = decisionFor(a.pinny, a.name);
    return {
      pinny: a.pinny, name: a.name, year: a.year, pos: a.pos, paid: a.paid,
      metrics: computeSelectionMetrics(a.pinny),
      status: dec ? dec.status : null,
      note: dec ? (dec.note || '') : ''
    };
  });
}
function distinctPositions(){
  const set = new Set();
  roster.forEach(a=>{ (a.pos||'').split(',').forEach(p=>{ const t=p.trim(); if(t) set.add(t); }); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function filteredSelection(){
  const q = state.selectionSearch.trim().toLowerCase();
  let list = selectionRoster();
  if(q) list = list.filter(a=> a.name.toLowerCase().includes(q) || String(a.pinny).includes(q) || (a.pos||'').toLowerCase().includes(q));
  if(state.selectionStatusFilter==='undecided') list = list.filter(a=>!a.status);
  else if(state.selectionStatusFilter!=='all') list = list.filter(a=>a.status===state.selectionStatusFilter);
  if(state.selectionPositionFilter!=='all'){
    const pf = state.selectionPositionFilter.toLowerCase();
    list = list.filter(a=> (a.pos||'').toLowerCase().split(',').some(p=>p.trim()===pf));
  }
  const sortFns = {
    name: (a,b)=> a.name.localeCompare(b.name),
    position: (a,b)=> (a.pos||'').localeCompare(b.pos||'') || a.name.localeCompare(b.name),
    skill: (a,b)=> (b.metrics.skillAvg||-999) - (a.metrics.skillAvg||-999),
    compete: (a,b)=> b.metrics.compete - a.metrics.compete,
    tcs: (a,b)=> (b.metrics.tcsAvg||-999) - (a.metrics.tcsAvg||-999)
  };
  return list.sort(sortFns[state.selectionSort] || sortFns.name);
}
function addToCompareByQuery(query){
  const q = query.trim().toLowerCase();
  if(!q){ toast('Type a name or pinnie number first'); return; }
  const all = selectionRoster();
  let matches = /^\d+$/.test(q)
    ? all.filter(a=> String(a.pinny)===q)
    : all.filter(a=> a.name.toLowerCase().includes(q));
  if(matches.length===0){ state.compareMatches = []; toast('No athlete matches that search'); renderSelectionMain(); return; }
  if(matches.length>1){
    state.compareMatches = matches.map(a=>({pinny:a.pinny, name:a.name, pos:a.pos}));
    renderSelectionMain();
    return;
  }
  const m = matches[0];
  if(!state.compareList.includes(m.pinny)) state.compareList.push(m.pinny);
  state.compareQuery = ''; state.compareMatches = [];
  renderSelectionMain();
}
function selectCompareMatch(pinny){
  if(!state.compareList.includes(pinny)) state.compareList.push(pinny);
  state.compareQuery = ''; state.compareMatches = [];
  renderSelectionMain();
}
function toggleCompare(pinny){
  const i = state.compareList.indexOf(pinny);
  if(i>=0) state.compareList.splice(i,1);
  else state.compareList.push(pinny);
  renderSelectionMain();
}
function exportDecisionsCsv(){
  const cols = ['pinny','name','year','pos','paid','decision','decidedAt','note','skillAvg','compete','tcsAvg','repsLogged'];
  const rows = [cols.join(',')];
  selectionRoster().sort((a,b)=>a.pinny-b.pinny).forEach(a=>{
    const dec = decisionFor(a.pinny, a.name);
    const row = [a.pinny, csvSafe(a.name), csvSafe(a.year), csvSafe(a.pos), a.paid?'Y':'N', dec?statusLabel(dec.status):'', dec?dec.decidedAt:'', dec?csvSafe(dec.note||''):'',
      a.metrics.skillAvg!==null? a.metrics.skillAvg.toFixed(2):'', a.metrics.compete, a.metrics.tcsAvg!==null? a.metrics.tcsAvg.toFixed(2):'', a.metrics.reps];
    rows.push(row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`geegees-team-decisions-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function fmtMetric(v){ return v===null || v===undefined ? '—' : v.toFixed(2); }
function decideButtons(pinny, status){
  return ['team1','team2','reserve','release'].map(s=>
    `<button class="${s} ${status===s?'on':''}" data-decide="${pinny}" data-status="${s}">${statusLabel(s)}</button>`
  ).join('');
}
function positionBreakdown(){
  return distinctPositions().map(pos=>{
    const athletes = selectionRoster().filter(a=> (a.pos||'').toLowerCase().split(',').some(p=>p.trim()===pos.toLowerCase()));
    const c = {team1:0, team2:0, reserve:0, release:0, undecided:0};
    athletes.forEach(a=>{ if(a.status) c[a.status]++; else c.undecided++; });
    return { pos, total:athletes.length, ...c };
  }).filter(r=>r.total>0);
}
function selectionTableHtml(list){

    <th></th><th>Pinnie</th><th>Name</th><th>Position(s)</th><th>Skill</th><th>Compete</th><th>TCS</th><th>Status</th><th>Assign</th>
  </tr></thead><tbody>`;
  list.forEach(a=>{
    html += `<tr>
      <td><input type="checkbox" class="comparecheck" data-compare="${a.pinny}" ${state.compareList.includes(a.pinny)?'checked':''}></td>
      <td><span class="pinnybadge">#${a.pinny}</span></td>
      <td><span class="rostername">${escapeHtml(a.name)}</span><div class="rosteryear">${escapeHtml(a.year||'')} · ${a.paid?'Paid':'Unpaid'}</div></td>
      <td><span class="rosterpos">${escapeHtml(a.pos||'')}</span></td>
      <td>${fmtMetric(a.metrics.skillAvg)}</td>
      <td>${a.metrics.compete>0?'+':''}${a.metrics.compete}</td>
      <td>${fmtMetric(a.metrics.tcsAvg)}</td>

  return html;
}

  document.querySelectorAll('[data-compare]').forEach(cb=>{
    cb.onchange = ()=> toggleCompare(parseInt(cb.dataset.compare));

  document.querySelectorAll('[data-decide]').forEach(b=>{

  main.innerHTML = html;

  document.querySelectorAll('[data-uncompare]').forEach(b=>{

/* ---------------------------------------------------------------
   LIVE AUTO-SYNC
   Pulls the shared backend on an interval so every evaluator's
   tablet reflects everyone else's entries without a manual tap.
   Only the log table is touched — never the in-progress form —
   so it never interrupts someone mid-entry.
---------------------------------------------------------------- */
let syncing = false;
async function backgroundSync(){
  if(syncing) return;
  syncing = true;
  try{
    const res = await cloudGet(STORAGE_KEY);
    const fresh = res && res.value ? JSON.parse(res.value) : [];
    // MERGE, never overwrite: a poll can resolve with a snapshot older than
    // what's already sitting locally (e.g. mid-simulation, or another device's
    // save still in flight). Blindly replacing local entries with a stale
    // fetch silently discards not-yet-synced work. Union by id instead.
    const merged = mergeEntriesById(entries, fresh);
    const changed = merged.length !== entries.length;
    const localHadExtra = merged.length !== fresh.length;
    entries = merged;
    if(changed){
      if(state.viewMode==='coach'){ renderCoachLog(); renderSnapshot(); renderLiveTotals(); }
      else if(state.viewMode==='evaluator'){ renderLog(); }
    }
    if(localHadExtra){
      // the backend was missing entries we already have locally — push the
      // merged, complete set back up so it catches up instead of losing them.
      await saveEntries();
    }
    updateSyncStatus('live');
  }catch(e){
    updateSyncStatus('offline');
  }
  syncing = false;
}
function updateSyncStatus(state){
  lastSyncOk = (state==='live');
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = state==='live' ? '● Synced' : '● Sync paused — check connection';
  el.style.color = state==='live' ? '#BFE8D2' : '#F3C6C6';
}
setInterval(backgroundSync, 8000);

document.getElementById('dateTag').textContent = new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
loadEvaluatorName();
Promise.all([loadEntries(), loadRosterFromCloud(), loadDecisionsFromCloud()]).then(renderAll);

// Warn before closing/refreshing if a save is still in flight, or the last
// sync attempt failed — the one window where something could be sitting
// only in this tab's memory and nowhere else yet.
window.addEventListener('beforeunload', function(e){
  if(pendingSaves>0 || !lastSyncOk){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
